name: Build & Release APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Publish Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Release APK
        run: ./gradlew assembleRelease --no-daemon

      - name: Rename APK with Tag Version
        run: |
          TAG_NAME="${GITHUB_REF_NAME:-latest}"
          cp app/build/outputs/apk/release/app-release.apk "synoptic-logbook-${TAG_NAME}.apk"
          echo "Generated synoptic-logbook-${TAG_NAME}.apk"

      - name: Create GitHub Release & Upload APK
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: synoptic-logbook-*.apk
          generate_release_notes: true
          draft: false
          prerelease: false
